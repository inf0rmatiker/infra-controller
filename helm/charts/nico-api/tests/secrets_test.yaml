suite: nico-api secrets config
templates:
  - configmap.yaml
  - deployment.yaml
release:
  namespace: nico-system
tests:
  - it: omits [secrets] from config when secrets.enabled is false
    documentIndex: 0
    asserts:
      - notMatchRegex:
          path: data["nico-api-config.toml"]
          pattern: '\[secrets\]'

  - it: renders writer_routing with racks to postgres when secrets enabled
    documentIndex: 0
    set:
      secrets:
        enabled: true
        backends:
          - postgres
          - vault
        writer: vault
        writerRouting:
          "/": vault
          racks: postgres
        routing:
          "/": default-key
          racks: default-key
        kms:
          active: local
          provider:
            type: integrated
            keys:
              default-key:
                env: CARBIDE_SECRETS_KEY_DEFAULT
    asserts:
      - matchRegex:
          path: data["nico-api-config.toml"]
          pattern: '\[secrets\]'
      - matchRegex:
          path: data["nico-api-config.toml"]
          pattern: '\[secrets\.writer_routing\]'
      - matchRegex:
          path: data["nico-api-config.toml"]
          pattern: '"racks" = "postgres"'
      - matchRegex:
          path: data["nico-api-config.toml"]
          pattern: 'backends = \["postgres", "vault"\]'

  - it: injects KMS key env when kmsKeySecret enabled
    documentIndex: 1
    set:
      secrets:
        enabled: true
        kmsKeySecret:
          enabled: true
          name: nico-secrets-kms-keys
          key: default-key
          envVar: CARBIDE_SECRETS_KEY_DEFAULT
        backends:
          - postgres
          - vault
        writer: vault
        routing:
          "/": default-key
        kms:
          active: local
          provider:
            type: integrated
            keys:
              default-key:
                env: CARBIDE_SECRETS_KEY_DEFAULT
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="CARBIDE_SECRETS_KEY_DEFAULT")].valueFrom.secretKeyRef.name
          value: nico-secrets-kms-keys
